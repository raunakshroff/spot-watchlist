name: Daily market update

on:
  schedule:
    # 10:45 UTC = 16:15 IST (post NSE close)
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch market data & update JSON
        run: python scripts/daily_update.py

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/watchlist.json public/data/history.json public/data/meta.json \
                  public/data/indices.json \
                  docs/data/watchlist.json docs/data/history.json docs/data/meta.json \
                  docs/data/indices.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          DAY=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d'))")
          git commit -m "data: market update ${DAY}"
          git push
